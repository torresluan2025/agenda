<div class="mx-auto flex w-full max-w-lg flex-col items-center rounded-xl border border-slate-200 bg-white p-8 shadow-lg md:p-12">
     <h1 class="text-slate-900 text-3xl font-bold leading-tight tracking-tight mb-2 text-center">Cadastro Profissional</h1>
     <p class="text-slate-600 text-base mb-8 text-center">Crie sua conta ConnectPro para começar.</p>
     <form class="w-full space-y-6">
       <div class="flex flex-col gap-1.5">
         <label class="text-slate-800 text-sm font-medium leading-normal" for="professionalName">Nome Profissional</label>
         <div class="relative">
           <span class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">badge</span>
           <input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-slate-300 bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 h-12 placeholder:text-slate-400 p-3 pl-10 text-sm font-normal leading-normal transition-colors" id="professionalName" placeholder="Digite seu nome profissional" value=""/>
         </div>
       </div>
       <div class="flex flex-col gap-1.5">
         <label class="text-slate-800 text-sm font-medium leading-normal" for="telephone">Telefone</label>
         <div class="relative">
           <span class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">call</span>
           <input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-slate-300 bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 h-12 placeholder:text-slate-400 p-3 pl-10 text-sm font-normal leading-normal transition-colors" id="telephone" placeholder="Digite seu número de telefone" type="tel" value=""/>
         </div>
       </div>
       <div class="flex flex-col gap-1.5">
         <label class="text-slate-800 text-sm font-medium leading-normal" for="username">Nome de Usuário</label>
         <div class="relative">
           <span class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">person_outline</span>
           <input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-slate-300 bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 h-12 placeholder:text-slate-400 p-3 pl-10 text-sm font-normal leading-normal transition-colors" id="username" placeholder="Escolha um nome de usuário" value=""/>
         </div>
       </div>
       <div class="flex flex-col gap-1.5">
         <label class="text-slate-800 text-sm font-medium leading-normal" for="password">Senha</label>
         <div class="relative">
           <span class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">lock_outline</span>
           <input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-slate-300 bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 h-12 placeholder:text-slate-400 p-3 pl-10 text-sm font-normal leading-normal transition-colors" id="password" placeholder="Crie uma senha" type="password" value=""/>
         </div>
       </div>
       <div class="flex flex-col gap-1.5">
         <label class="text-slate-800 text-sm font-medium leading-normal" for="commission">Comissão (%)</label>
         <div class="relative">
           <span class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">percent</span>
           <input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-slate-300 bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 h-12 placeholder:text-slate-400 p-3 pl-10 text-sm font-normal leading-normal transition-colors" id="commission" placeholder="Digite o valor da comissão" type="number" value=""/>
         </div>
       </div>
       <button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-6 bg-blue-600 text-white text-base font-semibold leading-normal tracking-wide shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
         <span class="truncate">Cadastrar</span>
       </button>
     </form>
     <p class="mt-8 text-center text-sm text-slate-600">
       Já tem uma conta? <a class="font-medium text-blue-600 hover:text-blue-700" href="#">Faça login</a>
     </p>
   </div>
